<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move 3 — Cohesive custom style</title>
<style>
  :root { --cream: #f4efe6; --navy: #1a2744; --sun: #e8a84a; --wave: #4a8fb8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a1a; color: var(--cream); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
  h1 { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: #888; margin-bottom: 1.25rem; }
  .toggle { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  .toggle button { background: transparent; border: 1px solid #666; color: var(--cream); padding: 0.35rem 0.9rem; border-radius: 999px; cursor: pointer; font-size: 0.8rem; }
  .toggle button.active { background: var(--cream); color: #1a1a1a; }
  .stage { width: min(390px, 100%); aspect-ratio: 9/16; border-radius: 28px; overflow: hidden; position: relative; background: var(--cream); color: var(--navy); box-shadow: 0 24px 48px rgba(0,0,0,0.4); }
  .before, .after { height: 100%; padding: 1.75rem 1.4rem; display: flex; flex-direction: column; align-items: center; }
  .stage.show-before .after { display: none; }
  .stage:not(.show-before) .before { display: none; }
  .art { width: 180px; height: 180px; border-radius: 50%; background: linear-gradient(145deg, var(--sun) 0%, #f0c070 40%, var(--wave) 100%); margin: 1.5rem 0 1.25rem; }
  .after .art { border-radius: 0; clip-path: url(#scallop); /* use generated clip in real use */ border-radius: 40%; /* fallback visual */ box-shadow: 0 0 0 4px var(--navy); }
  .title { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.04em; }
  .after .title { font-size: 1.6rem; letter-spacing: 0.12em; /* curved in full version via SVG */ }
  .artist { font-size: 0.85rem; opacity: 0.7; margin: 0.3rem 0 1.5rem; }
  .scrub { width: 100%; height: 3px; background: #ccc; border-radius: 2px; margin: 1rem 0; position: relative; }
  .after .scrub { height: 4px; background: linear-gradient(90deg, var(--wave), var(--sun)); border-radius: 4px; }
  .controls { display: flex; gap: 0.75rem; align-items: center; margin-top: auto; }
  .btn { width: 44px; height: 44px; border-radius: 50%; background: var(--navy); }
  .after .btn.play { width: 64px; border-radius: 999px; background: var(--navy); }
  .after .btn.accent { background: var(--sun); }
  .after .btn.wave { background: var(--wave); }
  .note { margin-top: 1.25rem; max-width: 390px; font-size: 0.78rem; color: #888; line-height: 1.4; }
</style>
</head>
<body>
  <h1>Move 3 · Cohesive motif</h1>
  <div class="toggle">
    <button type="button" id="btn-before">Before</button>
    <button type="button" id="btn-after" class="active">After</button>
  </div>
  <div class="stage" id="stage">
    <div class="before">
      <div class="art"></div>
      <p class="title">Slow Sunday</p>
      <p class="artist">Maya Cole</p>
      <div class="scrub"></div>
      <div class="controls">
        <div class="btn"></div><div class="btn"></div><div class="btn"></div><div class="btn"></div><div class="btn"></div>
      </div>
    </div>
    <div class="after">
      <div class="art"></div>
      <p class="title">SLOW SUNDAY</p>
      <p class="artist">MAYA COLE</p>
      <div class="scrub"></div>
      <div class="controls">
        <div class="btn wave"></div><div class="btn"></div><div class="btn play"></div><div class="btn"></div><div class="btn accent"></div>
      </div>
    </div>
  </div>
  <p class="note">One motif (sun + waves) applied to crop, lettering treatment, scrubber, and control colours. Use the generated clip-path from scalloped_mask.py for the real wavy edge.</p>
  <script>
    const stage = document.getElementById("stage");
    document.getElementById("btn-before").onclick = () => { stage.classList.add("show-before"); document.getElementById("btn-before").classList.add("active"); document.getElementById("btn-after").classList.remove("active"); };
    document.getElementById("btn-after").onclick = () => { stage.classList.remove("show-before"); document.getElementById("btn-after").classList.add("active"); document.getElementById("btn-before").classList.remove("active"); };
  </script>
</body>
</html>
